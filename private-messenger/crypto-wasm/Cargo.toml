[package]
name = "pm_crypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin WebAssembly bridge to vodozemac (Olm, Ed25519) for the Private Messenger web client"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.2", default-features = false }
wasm-bindgen = "=0.2.130"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
vodozemac = { version = "=0.11.2", default-features = false, features = ["wasm_js"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
